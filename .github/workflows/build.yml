name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Report output
        shell: pwsh
        run: |
          $exe = Get-Item TaskbarPulse.exe
          "Built {0} ({1:N0} bytes)" -f $exe.Name, $exe.Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarPulse-windows-x64
          path: TaskbarPulse.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: TaskbarPulse-windows-x64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" TaskbarPulse.exe --title "Taskbar Pulse $GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA"
